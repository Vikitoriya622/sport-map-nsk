                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() { popup.update(); }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() { popup.setContent(tempDiv.innerHTML); popup.update(); }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');

                    setTimeout(function() { popup.setContent(tempDiv.innerHTML); popup.update(); }, 10);

function getMetroLine(stationName) {
    if (!stationName) return { name: 'Метро', color: '#0078D7' };
    
    var nameUpper = stationName.toUpperCase().trim();
    
    for (var i = 0; i < leninLineStations.length; i++) {
        if (nameUpper.includes(leninLineStations[i])) {
            return { 
                name: 'Ленинская линия', 
                color: '#D84315'
            };
        }
    }

        name: 'Дзержинская линия', 
        color: '#388E3C'
    };
}

                            const baseSize = item.baseSize || [20, 30];
                            const newSize = getIconSize(baseSize, currentZoom);
                            item.layer.clearLayers();
                            markers.forEach(m => {
                                const iconUrl = getIconUrl(item.layer, m.feature);
                                const icon = L.icon({ iconUrl: iconUrl, iconSize: newSize, iconAnchor: [newSize[0]/2, newSize[1]], popupAnchor: [0, -newSize[1]] });
                                const marker = L.marker(m.latlng, { icon: icon, title: m.feature && m.feature.properties ? m.feature.properties['name'] || '' : '', riseOnHover: true });
                                marker.feature = m.feature;
                                marker.addTo(item.layer);
                            });
                            if (item.layer.options && item.layer.options.onEachFeature) {
                                item.layer.eachLayer(function(layer) { if (layer.feature) item.layer.options.onEachFeature(layer.feature, layer); });
                            }
                        } catch (error) { console.error(`Ошибка при обновлении слоя ${item.name}:`, error); }
                    });
                }

                map.on('zoomend', updateIconsZoom);
                setTimeout(() => { updateIconsZoom(); console.log('✅ Масштабирование иконок активировано'); }, 1000);
            }, 2000);
        }

        function setupLargeObjectsScaling() {
            console.log('🏟️ Настройка масштабирования для крупных объектов (слой 56)...');
            setTimeout(function() {
                if (typeof layer__56 === 'undefined' || !layer__56) { setTimeout(setupLargeObjectsScaling, 1000); return; }
                console.log('✅ Слой 56 найден, настраиваем масштабирование');
                function getIconSize(zoom) {
                    let scaleFactor = 1;
                    if (zoom >= 18) scaleFactor = 4.0;
                    else if (zoom >= 17) scaleFactor = 3.7;
                    else if (zoom >= 16) scaleFactor = 3.4;
                    else if (zoom >= 15) scaleFactor = 3.1;
                    else if (zoom >= 14) scaleFactor = 2.8;
                    else if (zoom >= 13) scaleFactor = 2.5;
                    else if (zoom >= 12) scaleFactor = 2.2;
                    else if (zoom >= 11) scaleFactor = 1.9;
                    else scaleFactor = 1.6;
                    return [Math.round(100 * scaleFactor), Math.round(100 * scaleFactor)];
                }
                function updateLargeIcons() {
                    const currentZoom = map.getZoom();
                    const newSize = getIconSize(currentZoom);
                    const markers = [];
                    layer__56.eachLayer(function(layer) { if (layer instanceof L.Marker) markers.push({ feature: layer.feature, latlng: layer.getLatLng() }); });
                    if (markers.length === 0) return;
                    layer__56.clearLayers();
                    markers.forEach(m => {
                        if (m.feature && m.feature.properties) {
                            var name = m.feature.properties['name'] || '';
                            var iconFile = 'images/building.png';
                            if (name.includes('НГТУ') || name.includes('нгту')) iconFile = 'images/НГТУ.png';
                            else if (name.includes('Подгорного') || name.includes('подгорный')) iconFile = 'images/Центр_Подгорного.png';
                            else if (name.includes('Позднякова') || name.includes('позднякова')) iconFile = 'images/Позднякова.png';
                            else if (name.includes('ЛДС') || name.includes('лдс')) iconFile = 'images/ЛДС_Сибирь.png';
                            else if (name.includes('Локомотив') || name.includes('локомотив')) iconFile = 'images/Локомотив.png';
                            else if (name.includes('Сибирь-Арена') || name.includes('сибирь')) iconFile = 'images/сибирь-арена.png';
                            else if (name.includes('Заря') || name.includes('заря')) iconFile = 'images/Заря.png';
                            else if (name.includes('Александрит') || name.includes('александрит')) iconFile = 'images/Александрит.png';
                            var icon = L.icon({ iconUrl: iconFile, iconSize: newSize, iconAnchor: [newSize[0]/2, newSize[1]], popupAnchor: [0, -newSize[1]] });
                            var marker = L.marker(m.latlng, { icon: icon });
                            marker.feature = m.feature;
                            marker.addTo(layer__56);
                        }
                    });
                    if (layer__56.options && layer__56.options.onEachFeature) {
                        layer__56.eachLayer(function(layer) { if (layer.feature) layer__56.options.onEachFeature(layer.feature, layer); });
                    }
                    console.log('Слой 56: зум', currentZoom, 'размер иконок', newSize[0] + 'x' + newSize[1]);
                }
                map.on('zoomend', updateLargeIcons);
                setTimeout(updateLargeIcons, 500);
            }, 2500);
        }

        window.addEventListener('load', function() {
            setTimeout(setupZoomResponsiveIcons, 1000);
            setTimeout(setupLargeObjectsScaling, 1500);
        });
        </script>
    </body>
</html>
